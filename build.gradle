plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
}

// versão com o commit (ex.: 0.1.0+c9c107c): o log do jogo e o /hanyu mostram qual .jar está rodando
def commit = ''
try {
    commit = providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD'; ignoreExitValue = true }.standardOutput.asText.get().trim()
} catch (Exception ignored) {}
version = commit ? "${project.mod_version}+${commit}" : project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // reconhecimento de voz offline (o JNA já vem com o Minecraft)
    implementation "com.alphacephei:vosk:0.3.45"
    include "com.alphacephei:vosk:0.3.45"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE")
}
