name: Montar o mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # usa o Gradle do wrapper (8.10.2): com Gradle mais novo o Loom 1.8 monta um .jar vazio sem dar erro
      - uses: gradle/actions/setup-gradle@v4

      - name: Versões mais novas do Fabric para 1.21.1
        run: |
          set -e
          YARN=$(curl -sf https://meta.fabricmc.net/v2/versions/yarn/1.21.1 | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['version'])")
          LOADER=$(curl -sf https://meta.fabricmc.net/v2/versions/loader/1.21.1 | python3 -c "import sys,json; print([x for x in json.load(sys.stdin) if x['loader']['stable']][0]['loader']['version'])")
          API=$(curl -sf https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | python3 -c "import sys,re; v=[x for x in re.findall(r'<version>([^<]+)</version>', sys.stdin.read()) if x.endswith('+1.21.1')]; print(v[-1])")
          echo "yarn=$YARN loader=$LOADER api=$API"
          sed -i "s/^yarn_mappings=.*/yarn_mappings=$YARN/; s/^loader_version=.*/loader_version=$LOADER/; s/^fabric_version=.*/fabric_version=$API/" gradle.properties

      - name: Modelo de voz em chinês (Vosk, ~42 MB)
        run: |
          mkdir -p src/main/resources/mandarimcraft
          curl -sfL --retry 3 -o src/main/resources/mandarimcraft/model.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          ls -la src/main/resources/mandarimcraft/

      - name: Montar
        run: ./gradlew build --no-daemon --stacktrace

      - name: Guardar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: mandarimcraft
          path: build/libs/*.jar

      - name: Publicar em Releases (versão mais nova)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "Mandarim Craft (última versão)" --notes "Baixe o arquivo .jar e coloque na pasta mods do Minecraft 1.21.1 com Fabric." --prerelease --target "$GITHUB_SHA"
